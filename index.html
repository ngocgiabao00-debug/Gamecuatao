<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thế Giới Game Độc Lạ - Lớp 8</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 750px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* --- TRANG CHỦ --- */
        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        #home-screen h1 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #e43f5a;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #home-screen p {
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
            padding: 0 10px;
        }
        .btn-play {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 173, 181, 0.4);
        }
        .btn-play:active {
            transform: scale(0.95);
        }

        /* --- TRANG CHỌN NHÂN VẬT --- */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .nature-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #134e5e, #71b280);
            z-index: 0;
            overflow: hidden;
            border-radius: 20px;
        }

        @keyframes flyAcross {
            0% { transform: translateX(-50px); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
100% { transform: translateX(400px); opacity: 0; }
        }
        .flying-object {
            position: absolute;
            top: 40px;
            font-size: 20px;
            animation: flyAcross 8s linear infinite;
        }
        .airplane {
            position: absolute;
            top: 70px;
            font-size: 24px;
            animation: flyAcross 12s linear infinite;
            animation-delay: 4s;
        }

        .screen h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #ffeb3b;
            z-index: 1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .char-container {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            margin-bottom: 15px;
            z-index: 1;
        }

        .char-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #00adb5;
            border-radius: 15px;
            width: 46%;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .avatar-box {
            position: relative;
            width: 110px;
            height: 150px;
            margin-bottom: 10px;
        }

        .body-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes headShake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(8deg); }
            100% { transform: rotate(0deg); }
        }

        .face-animated {
            position: absolute;
            animation: headShake 2.5s ease-in-out infinite;
            transform-origin: bottom center;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fff;
            z-index: 2;
        }

        .face-char1 {
            top: 15px;
            left: 32px;
            width: 45px;
            height: 45px;
        }

        .face-char2 {
            top: 20px;
            left: 33px;
            width: 44px;
            height: 44px;
        }

        .btn-select {
            background-color: #e43f5a;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(228, 63, 90, 0.4);
        }
        .btn-select:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TRANG CHỦ -->
        <div id="home-screen">
            <h1>THẾ GIỚI CỦA TÔI</h1>
            <p>Hello xin chào! Đã tới với thế giới game độc quyền đỉnh cao lớp 8.</p>
<button class="btn-play" onclick="goToCharacterSelect()">OPEN / PLAY</button>
        </div>

        <!-- TRANG CHỌN NHÂN VẬT -->
        <div id="char-screen" class="screen">
            <div class="nature-bg">
                <div class="flying-object">🕊️ Chim bay...</div>
                <div class="airplane">✈️ Máy bay...</div>
            </div>

            <h2>CHỌN NHÂN VẬT</h2>
            
            <div class="char-container">
                <div class="char-card">
                    <div class="avatar-box">
                        <img src="nhanvat1.png" alt="Lực sĩ" class="body-img">
                        <img src="khuonmat1.png" alt="Mặt 1" class="face-animated face-char1">
                    </div>
                    <button class="btn-select" onclick="selectChar('Nhân Vật Lực Sĩ')">CHỌN</button>
                </div>

                <div class="char-card">
                    <div class="avatar-box">
                        <img src="nhanvat2.png" alt="Nghèo khổ" class="body-img">
                        <img src="khuonmat2.png" alt="Mặt 2" class="face-animated face-char2">
                    </div>
                    <button class="btn-select" onclick="selectChar('Nhân Vật Đói Khổ')">CHỌN</button>
                </div>
            </div>
            
            <p style="font-size: 13px; color: #fff; z-index: 1; font-weight: bold;">Chạm nút CHỌN bên dưới để bắt đầu!</p>
        </div>
    </div>

    <script>
        function goToCharacterSelect() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('char-screen').style.display = 'flex';
        }

        function selectChar(charName) {
            alert("Bạn đã chọn: " + charName + "! Game chuẩn bị khởi chạy...");
        }
    </script>
</body>
</html>
